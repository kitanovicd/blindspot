name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check
        run: |
          go vet ./...
          sh -n install.sh
          sh -n scripts/release.sh
      - name: Build release
        run: sh scripts/release.sh "$VERSION"
      - name: Verify Linux binary
        run: |
          stage=$(mktemp -d)
          tar -xzf dist/blindspot_linux_amd64.tar.gz -C "$stage"
          "$stage/blindspot" --version | grep -F "blindspot $VERSION "
          "$stage/blindspot" --help
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --title "Blindspot $VERSION" --generate-notes
